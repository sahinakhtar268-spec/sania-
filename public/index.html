<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sania, You Make Me Happy! 🎨💖</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Hey Sania! 🌟</h1>
      <p class="subtitle">Your art & drawings make the world brighter! 🎨✨</p>
    </header>

    <section class="compliments-section">
      <h2>Special Compliments for You 💕</h2>
      <div id="compliments-list" class="compliments-grid"></div>
      <button id="random-btn">Get Random Happy Message! 🎉</button>
    </section>

    <section class="art-section">
      <h2>Your Art Zone 🖌️</h2>
      <canvas id="drawing-canvas" width="400" height="400"></canvas>
      <p>Draw something happy! (Click to draw hearts)</p>
    </section>

    <footer>
      <p>Made with ❤️ to make you smile, Sania!</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
